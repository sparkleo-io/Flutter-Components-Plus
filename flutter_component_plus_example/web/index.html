<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_component_plus_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Reusable Flutter Components Package</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Loading and error states -->
  <style>
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 9999;
    }
    
    #loading .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #error {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f44336;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 9999;
      text-align: center;
      padding: 20px;
    }
    
    #error button {
      background: white;
      color: #f44336;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    
    #error button:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <!-- Loading indicator -->
  <div id="loading">
    <div class="spinner"></div>
    <h2>Loading Flutter App...</h2>
    <p>Please wait while the application initializes</p>
  </div>
  
  <!-- Error message -->
  <div id="error">
    <h2>⚠️ App Failed to Load</h2>
    <p>There was an error loading the Flutter application.</p>
    <button onclick="location.reload()">🔄 Refresh Page</button>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Error handling and loading states -->
  <script>
    // Show loading state
    window.addEventListener('load', function() {
      // Hide loading indicator when Flutter loads
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    });

    // Handle Flutter errors
    window.addEventListener('flutter-first-frame', function() {
      console.log('Flutter app loaded successfully');
    });

    // Handle Flutter load errors
    window.addEventListener('flutter-error', function(e) {
      console.error('Flutter error:', e);
      var errorDiv = document.getElementById('error');
      if (errorDiv) {
        errorDiv.style.display = 'block';
        errorDiv.innerHTML = 'Failed to load app. Please refresh the page.';
      }
    });
  </script>
</body>
</html>
