[build]
  publish = "build/web"
  command = "flutter build web --release --tree-shake-icons --optimization-level 4 --no-source-maps"

[build.environment]
  FLUTTER_VERSION = "3.16.0"
  FLUTTER_OPTIMIZATION_LEVEL = "4"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
