version: 1.2.0
homepage: https://github.com/sparkleo-io/Reusable-Flutter-Components-Package

executables:
  fcp: fcp

environment:
  sdk: '>=3.0.0 <5.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter: {sdk: flutter}
  http: ^1.6.0
  shared_preferences: ^2.5.5
  syncfusion_flutter_pdfviewer: ^33.2.15
  syncfusion_flutter_datagrid: ^33.2.15
  fl_chart: ^1.2.0
  permission_handler: ^12.0.3
  args: ^2.7.0
  yaml: ^3.1.3
  path: ^1.9.1
  path_provider: ^2.1.6
  device_info_plus: ^13.2.0
  media_store_plus: ^0.1.3
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


